<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ 坤哥的进球记录簿 · 编辑</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --yellow: #f5b700; --yellow-dark: #c79100; --black: #1a1a1a;
            --gray: #f4f4f4; --white: #ffffff; --text: #1a1a1a;
        }
        * {box-sizing: border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
        body{background:var(--gray);color:var(--text);padding:16px;max-width:900px;margin:0 auto;}
        .header{background:var(--black);color:white;padding:20px;border-radius:12px;margin-bottom:20px;}
        h1{font-size:22px;margin-bottom:6px;}
        .card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #00000014;}
        input,select,textarea{width:100%;padding:10px 12px;margin:8px 0 14px 0;border:1px solid #ccc;border-radius:8px;font-size:15px;}
        button{padding:11px 16px;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin:4px;}
        .btn-yellow{background:var(--yellow);color:#000;font-weight:bold;}
        .btn-red{background:#e74c3c;color:white;}
        .btn-group{margin:12px 0;}
        .item{padding:14px;border-bottom:1px solid #eee;}
        .item-title{font-weight:bold;font-size:16px;margin-bottom:4px;}
    </style>
</head>
<body>
<div class="header">
    <h1>⚽ 坤哥的进球记录簿【编辑模式】</h1>
    <div>新增 / 修改 / 删除比赛记录</div>
</div>

<div class="card">
    <h3>📝 添加/编辑比赛</h3>
    <input type="text" id="matchTitle" placeholder="比赛名称，例如：校内友谊赛A队VS B队">
    <input type="date" id="matchDate">
    <textarea id="matchNote" placeholder="备注：进球数、助攻、场上表现等"></textarea>
    <input type="hidden" id="editId">
    <div class="btn-group">
        <button class="btn-yellow" onclick="saveMatch()">保存记录</button>
        <button onclick="clearForm()">清空表单</button>
    </div>
</div>

<div class="card">
    <h3>📋全部比赛列表</h3>
    <div id="listWrap">加载中...</div>
</div>

<script>
    // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCU_Gt0SqS70SSwp2Qgyybx0Xv3mPasS7c",
  authDomain: "lkgoals.firebaseapp.com",
  databaseURL: "https://lkgoals-default-rtdb.firebaseio.com",
  projectId: "lkgoals",
  storageBucket: "lkgoals.firebasestorage.app",
  messagingSenderId: "244388763214",
  appId: "1:244388763214:web:ab648bf94463b45344151f"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
// 本地写死密码，不再读取数据库secret节点
const REAL_EDIT_PASSWORD = "0830";
window.canEdit = false;

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refMatches = db.ref("matches");

// 密码弹窗校验
(function checkPassword(){
    let inputPwd = prompt("请输入编辑密码，才可新增/修改/删除记录");
    if(!inputPwd || inputPwd !== REAL_EDIT_PASSWORD){
        alert("❌密码错误或未输入，仅浏览，无法修改数据");
        window.canEdit = false;
    }else{
        alert("✅密码正确，已开启编辑权限");
        window.canEdit = true;
    }
    renderList();
})();

// 渲染列表
function renderList(){
    refMatches.once("value").then(snap=>{
        const data = snap.val()||{};
        const wrap = document.getElementById("listWrap");
        wrap.innerHTML="";
        if(Object.keys(data).length===0){
            wrap.innerHTML="<div style='padding:20px;color:#666'>暂无比赛记录</div>";
            return;
        }
        Object.keys(data).forEach(key=>{
            const m = data[key];
            const div = document.createElement("div");
            div.className="item";
            div.innerHTML=`
                <div class="item-title">${m.title||""}｜${m.date||""}</div>
                <div>${m.note||""}</div>
                <div class="btn-group">
                    ${window.canEdit?`
                    <button onclick="fillEdit('${key}')">编辑</button>
                    <button class="btn-red" onclick="del('${key}')">删除</button>
                    `:"<span style='color:#888'>只读模式</span>"}
                </div>
            `;
            wrap.appendChild(div);
        })
    }).catch(err=>{
        document.getElementById("listWrap").innerHTML=`<div style="color:red;padding:20px">读取失败：${err.message}</div>`;
    })
}

//保存
function saveMatch(){
    if(!window.canEdit){alert("无编辑权限！");return;}
    const title = document.getElementById("matchTitle").value.trim();
    const date = document.getElementById("matchDate").value;
    const note = document.getElementById("matchNote").value.trim();
    const editId = document.getElementById("editId").value;
    if(!title){alert("请填写比赛名称");return;}
    const obj = {title,date,note};
    if(editId){
        refMatches.child(editId).set(obj).then(()=>{alert("修改成功");clearForm();renderList();})
    }else{
        refMatches.push(obj).then(()=>{alert("新增成功");clearForm();renderList();})
    }
}

//回填编辑
function fillEdit(k){
    refMatches.child(k).once("value").then(snap=>{
        const d = snap.val();
        document.getElementById("editId").value=k;
        document.getElementById("matchTitle").value=d.title||"";
        document.getElementById("matchDate").value=d.date||"";
        document.getElementById("matchNote").value=d.note||"";
    })
}

//删除
function del(k){
    if(!window.canEdit)return;
    if(!confirm("确定删除这条记录？"))return;
    refMatches.child(k).remove().then(()=>renderList());
}

//清空表单
function clearForm(){
    document.getElementById("editId").value="";
    document.getElementById("matchTitle").value="";
    document.getElementById("matchDate").value="";
    document.getElementById("matchNote").value="";
}
</script>
</body>
</html>
