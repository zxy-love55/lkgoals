<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ 坤哥进球记录簿 · 编辑</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --yellow: #f5b700; --yellow-dark: #c79100; --black: #1a1a1a;
            --gray: #f4f4f4; --white: #ffffff; --text: #1a1a1a;
        }
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:system-ui, sans-serif;
        }
        body {
            background:var(--gray);
            color:var(--text);
        }
        header {
            background-color:var(--black);
            color:white;
            padding:16px 20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .container {
            max-width:900px;
            margin:24px auto;
            padding:0 16px;
        }
        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }
        .btn-yellow{
            background-color:var(--yellow);
            border:none;
            color:#000;
            font-weight:bold;
            padding:12px 24px;
            border-radius:12px;
            font-size:16px;
            cursor:pointer;
        }
        .btn-yellow:hover{
            background-color:var(--yellow-dark);
        }
        .match-item{
            background:white;
            padding:16px;
            border-radius:12px;
            margin-bottom:12px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .operate button{
            margin-left:8px;
            padding:6px 12px;
        }
        .mask{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.6);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:99;
        }
        .modal{
            background:white;
            width:92%;
            max-width:520px;
            padding:24px;
            border-radius:14px;
        }
        .modal h3{
            margin-bottom:16px;
        }
        .form-item{
            margin-bottom:12px;
        }
        label{
            display:block;
            margin-bottom:4px;
        }
        input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:8px;
        }
        .modal-buttons{
            margin-top:20px;
            display:flex;
            gap:12px;
        }
        .hide{
            display:none !important;
        }
        .tip-error{
            color:#d63031;
            margin:8px 0;
        }
    </style>
</head>
<body>
<header>
    <h1>⚽ 坤哥进球记录簿 · 编辑</h1>
    <div></div>
</header>
<div class="container">
    <div class="top-bar">
        <h2>比赛列表 <span id="count">0</span>场</h2>
        <button class="btn-yellow" id="addBtn">+ 添加比赛</button>
    </div>
    <div id="listWrap">加载中……</div>
</div>

<!--弹窗表单-->
<div class="mask hide" id="editMask">
    <div class="modal">
        <h3 id="modalTitle">新增比赛</h3>
        <div class="form-item">
            <label>对手队伍</label>
            <input type="text" id="inpOpponent">
        </div>
        <div class="form-item">
            <label>我方进球</label>
            <input type="number" id="inpOur">
        </div>
        <div class="form-item">
            <label>对手进球</label>
            <input type="number" id="inpOpp">
        </div>
        <div class="form-item">
            <label>比赛日期</label>
            <input type="date" id="inpDate">
        </div>
        <div class="form-item">
            <label>备注</label>
            <input type="text" id="inpNote">
        </div>
        <div class="modal-buttons">
            <button class="btn-yellow" id="saveBtn">保存</button>
            <button id="cancelBtn">取消</button>
        </div>
    </div>
</div>

<script>
// ==========【这里替换成你自己 Firebase 的配置】==========
const firebaseConfig = {
    apiKey: "替换你的apiKey",
    authDomain: "替换你的authDomain",
    databaseURL: "替换你的databaseURL",
    projectId: "替换你的projectId",
    storageBucket: "替换你的storageBucket",
    messagingSenderId: "替换你的messagingSenderId",
    appId: "替换你的appId"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 编辑权限全局标记
window.canEdit = false;
let editKey = null; // 当前编辑的记录key

// 打开页面，先弹出密码框
(async function checkPassword(){
    let inputPwd = prompt("请输入编辑密码，才可新增/修改/删除记录");
    if(!inputPwd){
        alert("未输入密码，仅浏览，无法修改数据");
        window.canEdit = false;
        renderList();
        return;
    }
    try{
        const snap = await db.ref("/secret/password").once("value");
        const realPwd = snap.val();
        if(inputPwd === realPwd){
            window.canEdit = true;
            alert("✅密码正确，已开启编辑权限");
        }else{
            window.canEdit = false;
            alert("❌密码错误，只能浏览，不能修改");
        }
    }catch(err){
        console.error("密码读取失败",err);
        alert("读取密码失败，无法编辑");
        window.canEdit = false;
    }
    renderList();
})();

// 渲染列表
async function renderList(){
    const wrap = document.querySelector("#listWrap");
    const countDom = document.querySelector("#count");
    wrap.innerHTML = "加载中……";
    try{
        const snapshot = await db.ref("matches").once("value");
        const data = snapshot.val() || {};
        const keys = Object.keys(data);
        countDom.innerText = keys.length;
        if(keys.length === 0){
            wrap.innerHTML = "<div>暂无比赛记录</div>";
            return;
        }
        let html = "";
        keys.forEach(k=>{
            const item = data[k];
            html += `
            <div class="match-item">
                <div>
                    <div>${item.date}｜对阵${item.opponent}</div>
                    <div>比分：${item.ourGoals} - ${item.oppGoals}｜备注：${item.note||""}</div>
                </div>
                <div class="operate">
                    <button onclick="openEdit('${k}')">编辑</button>
                    <button onclick="delItem('${k}')">删除</button>
                </div>
            </div>
            `
        })
        wrap.innerHTML = html;
    }catch(e){
        wrap.innerHTML = `<div class="tip-error">读取失败：${e.message}</div>`
    }
}

// 添加按钮
document.querySelector("#addBtn").onclick = function(){
    if(!window.canEdit){
        alert("没有编辑权限！密码不对，禁止新增");
        return;
    }
    openMask();
    editKey = null;
    document.querySelector("#modalTitle").innerText = "新增比赛";
    clearInput();
}

//打开弹窗
function openMask(){
    document.querySelector("#editMask").classList.remove("hide");
}
function closeMask(){
    document.querySelector("#editMask").classList.add("hide");
}
document.querySelector("#cancelBtn").onclick = closeMask;

//清空输入框
function clearInput(){
    document.querySelector("#inpOpponent").value = "";
    document.querySelector("#inpOur").value = "";
    document.querySelector("#inpOpp").value = "";
    document.querySelector("#inpDate").value = "";
    document.querySelector("#inpNote").value = "";
}

//编辑一条
window.openEdit = async function(key){
    if(!window.canEdit){
        alert("没有编辑权限！");
        return;
    }
    editKey = key;
    const snap = await db.ref("matches/"+key).once("value");
    const d = snap.val();
    document.querySelector("#inpOpponent").value = d.opponent;
    document.querySelector("#inpOur").value = d.ourGoals;
    document.querySelector("#inpOpp").value = d.oppGoals;
    document.querySelector("#inpDate").value = d.date;
    document.querySelector("#inpNote").value = d.note||"";
    document.querySelector("#modalTitle").innerText = "修改比赛";
    openMask();
}

//保存
document.querySelector("#saveBtn").onclick = async function(){
    if(!window.canEdit){
        alert("没有编辑权限！");
        return;
    }
    const opponent = document.querySelector("#inpOpponent").value.trim();
    const ourGoals = Number(document.querySelector("#inpOur").value);
    const oppGoals = Number(document.querySelector("#inpOpp").value);
    const date = document.querySelector("#inpDate").value;
    const note = document.querySelector("#inpNote").value.trim();
    if(!opponent||!date){
        alert("对手、日期不能为空");
        return;
    }
    const payload = {opponent,ourGoals,oppGoals,date,note};
    try{
        if(editKey){
            await db.ref("matches/"+editKey).set(payload);
        }else{
            await db.ref("matches").push(payload);
        }
        closeMask();
        renderList();
    }catch(err){
        alert("保存失败："+err.message);
    }
}

//删除
window.delItem = async function(key){
    if(!window.canEdit){
        alert("没有编辑权限！");
        return;
    }
    if(!confirm("确定删除这条记录吗？")) return;
    try{
        await db.ref("matches/"+key).remove();
        renderList();
    }catch(err){
        alert("删除失败："+err.message);
    }
}
</script>
</body>
</html>
